<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتبة النور الرقمية | المكتبة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/platform.css">
</head>
<body class="rtl">
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html"><span class="brand-badge">ن</span><span>مكتبة النور الرقمية</span></a>
      <button class="icon-btn mobile-toggle" data-mobile-toggle aria-label="تبديل قائمة التنقل">☰</button>
      <nav class="nav-links" data-nav-links>
        <a class="nav-link" href="index.html">الرئيسية</a><a class="nav-link" href="library.html">المكتبة</a><a class="nav-link" href="viewer.html">العارض</a><a class="nav-link" href="categories.html">التصنيفات</a><a class="nav-link" href="search.html">البحث</a><a class="nav-link" href="dashboard.html">لوحة التحكم</a><a class="nav-link" href="about.html">من نحن</a><a class="nav-link" href="contact.html">تواصل معنا</a>
      </nav>
      <div class="top-actions"><button class="icon-btn" data-lang-toggle>EN</button><button class="icon-btn" data-dark-toggle>◐</button></div>
    </div>
  </header>

  <main class="container">
    <nav class="breadcrumbs"><a href="index.html">الرئيسية</a> / <span>المكتبة</span></nav>
    <section class="section">
      <div class="section-head">
        <h1>مكتبة الكتب الإسلامية (PDF)</h1>
        <a class="btn primary" href="viewer.html?doc=quran1.pdf">فتح الملف الرئيسي</a>
      </div>
      <div class="grid cards-3" style="margin-bottom:1rem">
        <div class="card">
          <label for="category">التصنيف</label>
          <select id="category" data-filter-category>
            <option value="all">الكل</option>
            <option value="religion">ديني</option>
            <option value="education">تعليمي</option>
            <option value="guides">أدلة</option>
          </select>
        </div>
        <div class="card">
          <label for="sort">الترتيب حسب</label>
          <select id="sort" data-filter-sort>
            <option value="popularity">الشعبية</option>
            <option value="date">التاريخ</option>
            <option value="pages">عدد الصفحات</option>
          </select>
        </div>
        <form class="card search-wrap" data-search-form>
          <label for="library-search">بحث</label>
          <input id="library-search" class="search-input" type="search" placeholder="ابحث في عناوين ملفات PDF">
          <button class="btn primary search-btn" type="submit">انتقال</button>
        </form>
      </div>
      <div class="grid cards-3" data-library-grid aria-live="polite"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="stack"><strong>مكتبة النور الرقمية</strong><p class="muted">وصول سريع إلى الكتب والمراجع الإسلامية بصيغة PDF.</p></div>
      <nav class="footer-links"><a href="index.html">الرئيسية</a><a href="library.html">المكتبة</a><a href="viewer.html">العارض</a><a href="categories.html">التصنيفات</a><a href="search.html">البحث</a><a href="dashboard.html">لوحة التحكم</a><a href="about.html">من نحن</a><a href="contact.html">تواصل معنا</a></nav>
    </div>
  </footer>
  <script src="assets/js/platform.js"></script>
</body>
</html>
